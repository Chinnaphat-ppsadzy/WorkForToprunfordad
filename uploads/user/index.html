<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workshop #6</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="loginPage" class="auth-wrap">
      <div class="auth-card">
        <div class="auth-logo"><i class="fa fa-cloud"></i></div>
        <h1>Welcome back</h1>
        <p class="sub">Sign in to your file vault</p>

        <div class="input-group">
          <i class="fa fa-user"></i>
          <input id="username" placeholder="Username" />
        </div>
        <div class="input-group">
          <i class="fa fa-lock"></i>
          <input id="password" type="password" placeholder="Password" />
        </div>

        <button class="btn-primary" onclick="login()">Sign In</button>
        <button class="btn-ghost" onclick="show('registerPage')">
          Create an account
        </button>
      </div>
    </div>

    <div id="registerPage" class="auth-wrap">
      <div class="auth-card">
        <div class="auth-logo"><i class="fa fa-user-plus"></i></div>
        <h1>Create account</h1>
        <p class="sub">Join and start uploading files</p>

        <div class="input-group">
          <i class="fa fa-user"></i>
          <input id="regUsername" placeholder="Username" />
        </div>
        <div class="input-group">
          <i class="fa fa-lock"></i>
          <input id="regPassword" type="password" placeholder="Password" />
        </div>

        <button class="btn-primary" onclick="register()">Register</button>
        <button class="btn-ghost" onclick="show('loginPage')">
          Back to Login
        </button>
      </div>
    </div>

    <div id="userPage" class="app-wrap">
      <header class="topbar">
        <div class="topbar-logo"><i class="fa fa-cloud"></i></div>
        <span class="topbar-brand">เก็บไฟล์โหดไง</span>
        <div class="topbar-search">
          <i class="fa fa-search"></i>
          <input
            type="text"
            id="searchInput"
            placeholder="Search your files…"
            onkeyup="loadUserFiles()"
          />
        </div>
        <div class="topbar-right">
          <button class="btn-logout" onclick="logout()">
            <i class="fa fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </header>

      <div class="app-body">
        <main class="main">
          <div class="main-header">
            <h2>My Files</h2>
            <span id="uploadStatus"></span>
          </div>

          <div class="section-label">ALL FILES</div>
          <div class="file-grid" id="fileList">
            <div class="upload-card">
              <div class="upload-zone-icon"><i class="fa fa-upload"></i></div>
              <div class="upload-zone-text">
                <strong>Upload a file</strong>
                <span>Images, videos, documents — anything goes</span>
              </div>
              <label class="file-label" for="fileInput"
                ><i class="fa fa-folder-open"></i> Choose file</label
              >
              <input type="file" id="fileInput" />
              <button class="btn-upload" onclick="uploadFile()">Upload</button>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div id="adminPage" class="app-wrap">
      <header class="topbar">
        <div class="topbar-logo"><i class="fa fa-shield-alt"></i></div>
        <span class="topbar-brand">เก็บไฟล์โหดไง</span>
        <span class="admin-badge">ระดับหัวหน้าไงน้อง</span>
        <div class="topbar-right">
          <button
            class="btn-upload"
            style="margin: 0"
            onclick="loadAdminFiles()"
          >
            <i class="fa fa-sync-alt"></i> Refresh
          </button>
          <button class="btn-logout" onclick="logout()">
            <i class="fa fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </header>

      <div class="app-body">
        <main class="main">
          <div class="main-header">
            <h2>All Uploaded Files</h2>
          </div>
          <div class="section-label">MANAGE FILES</div>
          <div class="file-grid admin-grid" id="adminList"></div>
        </main>
      </div>
    </div>

    <!-- Share Modal -->
    <div id="shareModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Share File</h3>
          <button class="close-btn" onclick="closeShareModal()">&times;</button>
        </div>
        <div class="modal-body">
          <p id="shareFileName"></p>
          <label for="shareUserSelect">Select user to share with:</label>
          <select id="shareUserSelect" class="share-select">
            <option value="">Loading users...</option>
          </select>
        </div>
        <div class="modal-footer">
          <button class="btn-ghost" onclick="closeShareModal()">Cancel</button>
          <button class="btn-primary" onclick="confirmShare()">Share</button>
        </div>
      </div>
    </div>

    <script>
      const serverUrl = "http://localhost:5000";

      show("loginPage");

      function show(id) {
        document.querySelectorAll(".auth-wrap, .app-wrap").forEach((p) => {
          p.classList.remove("active");
        });
        document.getElementById(id).classList.add("active");
      }

      function login() {
        fetch(`${serverUrl}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: username.value,
            password: password.value,
          }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.role === "admin") {
              show("adminPage");
              loadAdminFiles();
            } else {
              show("userPage");
              loadUserFiles();
            }
          })
          .catch(() => alert("Login failed"));
      }

      function register() {
        fetch(`${serverUrl}/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: regUsername.value,
            password: regPassword.value,
          }),
        })
          .then((res) => res.text())
          .then((msg) => {
            alert(msg);
            show("loginPage");
          });
      }

      function logout() {
        show("loginPage");
      }

      function uploadFile() {
        const fileInput = document.getElementById("fileInput");
        const file = fileInput.files[0];
        if (!file) return;
        performUpload(file);
      }

      function performUpload(file) {
        const formData = new FormData();
        formData.append("file", file);
        fetch(`${serverUrl}/upload`, { method: "POST", body: formData }).then(
          () => {
            document.getElementById("uploadStatus").textContent =
              "✓ Upload successful";
            setTimeout(
              () => (document.getElementById("uploadStatus").textContent = ""),
              3000,
            );
            document.getElementById("fileInput").value = "";
            loadUserFiles();
          },
        );
      }

      function handleDragOver(e) {
        e.preventDefault();
        e.stopPropagation();
        const zone = document.getElementById("dragDropZone");
        if (zone) zone.classList.add("drag-over");
      }

      function handleDragLeave(e) {
        e.preventDefault();
        e.stopPropagation();
        const zone = document.getElementById("dragDropZone");
        if (zone) zone.classList.remove("drag-over");
      }

      function handleDrop(e) {
        e.preventDefault();
        e.stopPropagation();
        const zone = document.getElementById("dragDropZone");
        if (zone) zone.classList.remove("drag-over");
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          performUpload(files[0]);
        }
      }

      function getFileIcon(ext) {
        const map = {
          pdf: "fa-file-pdf",
          doc: "fa-file-word",
          docx: "fa-file-word",
          xls: "fa-file-excel",
          xlsx: "fa-file-excel",
          ppt: "fa-file-powerpoint",
          pptx: "fa-file-powerpoint",
          zip: "fa-file-archive",
          rar: "fa-file-archive",
          mp3: "fa-file-audio",
          wav: "fa-file-audio",
          mp4: "fa-file-video",
          webm: "fa-file-video",
          ogg: "fa-file-video",
          txt: "fa-file-alt",
          csv: "fa-file-csv",
        };
        return map[ext] || "fa-file";
      }

      function buildThumb(file, fileUrl, ext) {
        const imgExts = ["jpg", "jpeg", "png", "gif", "webp"];
        const vidExts = ["mp4", "webm", "ogg"];
        if (imgExts.includes(ext))
          return `<img src="${fileUrl}" alt="${file}" />`;
        if (vidExts.includes(ext))
          return `<video src="${fileUrl}" controls muted preload="metadata"></video>`;
        return `<i class="fa ${getFileIcon(ext)} file-icon"></i>`;
      }

      function loadUserFiles() {
        const keyword =
          document.getElementById("searchInput")?.value.toLowerCase() || "";
        fetch(`${serverUrl}/files`)
          .then((res) => res.json())
          .then((files) => {
            if (keyword) {
              files.sort((a, b) => {
                const aM = a.toLowerCase().includes(keyword) ? 0 : 1;
                const bM = b.toLowerCase().includes(keyword) ? 0 : 1;
                return aM - bM;
              });
            }
            const list = document.getElementById("fileList");
            const uploadCard = `<div class="upload-card" id="dragDropZone" ondrop="handleDrop(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)">
              <div class="upload-zone-icon"><i class="fa fa-upload"></i></div>
              <div class="upload-zone-text">
                <strong>Drag & drop files here</strong>
              </div>
              <input type="file" id="fileInput" onchange="uploadFile()" />
            </div>`;

            if (!files.length) {
              list.innerHTML =
                uploadCard +
                `<div class="empty-state"><i class="fa fa-folder-open"></i><p>No files yet. Upload something!</p></div>`;
              return;
            }

            const fileCards = files
              .map((file) => {
                const ext = file.split(".").pop().toLowerCase();
                const fileUrl = `${serverUrl}/download/${file}`;
                return `
              <div class="file-card" title="${file}">
                <div class="file-thumb">${buildThumb(file, fileUrl, ext)}</div>
                <div class="file-info">
                  <span class="file-name">${file}</span>
                  <div class="file-actions">
                    <a href="${fileUrl}" target="_blank">
                      <button class="icon-btn" title="Download"><i class="fa fa-download"></i></button>
                    </a>
                    <button class="icon-btn" title="Share" onclick="shareFile('${file}')"><i class="fa fa-share-alt"></i></button>
                  </div>
                </div>
              </div>`;
              })
              .join("");

            list.innerHTML = uploadCard + fileCards;
          });
      }

      function loadAdminFiles() {
        fetch(`${serverUrl}/files`)
          .then((res) => res.json())
          .then((files) => {
            const list = document.getElementById("adminList");
            if (!files.length) {
              list.innerHTML = `<div class="empty-state"><i class="fa fa-database"></i><p>No files on server.</p></div>`;
              return;
            }
            list.innerHTML = files
              .map((file) => {
                const ext = file.split(".").pop().toLowerCase();

                const fileUrl = `${serverUrl}/download/${file}`;
                console.log(fileUrl);
                return `
              <div class="file-card" title="${file}">
                <div class="file-thumb">${buildThumb(file, fileUrl, ext)}</div>
                <div class="file-info">
                  <span class="file-name">${file}</span>
                  <div class="file-actions">
                    <a href="${fileUrl}" target="_blank">
                      <button class="icon-btn" title="Open"><i class="fa fa-external-link-alt"></i></button>
                    </a>
                    <button class="icon-btn delete" title="Delete" onclick="deleteFile('${file}')">
                      <i class="fa fa-trash"></i>
                    </button>
                  </div>
                </div>
              </div>`;
              })
              .join("");
          });
      }

      function deleteFile(name) {
        if (!confirm(`Delete "${name}"?`)) return;
        fetch(`${serverUrl}/delete/${name}`, { method: "DELETE" }).then(() =>
          loadAdminFiles(),
        );
      }

      function shareFile(fileName) {
        document.getElementById("shareFileName").textContent =
          `Sharing: ${fileName}`;
        currentShareFile = fileName;
        loadShareUsers();
        document.getElementById("shareModal").classList.add("active");
      }

      function closeShareModal() {
        document.getElementById("shareModal").classList.remove("active");
        currentShareFile = null;
      }

      function loadShareUsers() {
        fetch(`${serverUrl}/users`)
          .then((res) => res.json())
          .then((users) => {
            const select = document.getElementById("shareUserSelect");
            select.innerHTML = users
              .map((user) => `<option value="${user}">${user}</option>`)
              .join("");
            if (users.length === 0) {
              select.innerHTML =
                "<option value=''>No other users available</option>";
            }
          });
      }

      function confirmShare() {
        const targetUser = document.getElementById("shareUserSelect").value;
        if (!targetUser) {
          alert("Please select a user");
          return;
        }

        fetch(`${serverUrl}/share`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            fileName: currentShareFile,
            targetUser: targetUser,
          }),
        })
          .then((res) => res.text())
          .then((msg) => {
            alert(msg);
            closeShareModal();
            loadUserFiles();
          });
      }

      let currentShareFile = null;
    </script>
  </body>
</html>
